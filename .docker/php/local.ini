# Increase the size of files you can upload (default is usually 2MB)
upload_max_filesize = 100M
post_max_size = 100M

# Give PHP more memory for heavy tasks like generating PDFs or processing images
memory_limit = 512M

# Set the maximum time a script can run (helpful for slow database migrations)
max_execution_time = 600

# Ensure PHP uses the correct system time
date.timezone = UTC

# Helpful for debugging - shows all errors
display_errors = On
error_reporting = E_ALL
